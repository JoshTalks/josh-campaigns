version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
    environment:
      - DJANGO_SETTINGS_MODULE=joshCampaigns.settings
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - C_FORCE_ROOT=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=django-db
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  celery:
    build: .
    command: celery -A joshCampaigns worker -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=joshCampaigns.settings
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - C_FORCE_ROOT=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=django-db
    depends_on:
      - redis
      - web
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A joshCampaigns beat -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=joshCampaigns.settings
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - C_FORCE_ROOT=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=django-db
    depends_on:
      - redis
      - web
    restart: unless-stopped

volumes:
  static_volume:
  redis_data:
